<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGem | Prestige Project Discovery</title>
    
    <!-- Refactored CSS modules -->
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="responsive.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="matrix-bg"></div>
    
    <header class="header">
        <div class="header-content">
            <div class="title-section">
                <h1 class="title">
                    <span class="rainbow-text">WebGem</span>
                    <span class="subtitle">Prestige Project Discovery</span>
                </h1>
                <p class="tagline">Discover technically sophisticated projects beyond the trending noise</p>
            </div>
            
            <div class="controls-section">
                <div class="controls toolbar">
                    <div class="main-controls">
                        <div class="control-group">
                            <label class="control-label">Discovery Mode</label>
                            <div class="segmented" role="tablist" aria-label="Discovery Mode">
                                <button class="seg-btn" data-mode="gems" aria-selected="true">Gems</button>
                                <button class="seg-btn" data-mode="technical">Technical</button>
                                <button class="seg-btn" data-mode="artistic">Artistic</button>
                                <button class="seg-btn" data-mode="underrated">Underrated</button>
                                <button class="seg-btn" data-mode="templates">Templates</button>
                            </div>
                        </div>
                        <div class="control-group versions-group">
                             <label for="minVersions" class="control-label">Min Versions</label>
                            <div class="range-inline">
                                <input type="range" id="minVersions" min="10" max="200" value="50" class="slider">
                                <span id="minVersionsDisplay" class="value-pill">50</span>
                            </div>
                        </div>
                        <button id="refreshBtn" class="btn-primary"><span class="btn-text">Discover</span></button>
                    </div>

                    <div class="secondary-controls">
                        <div class="inline-group sort-controls">
                            <span class="inline-label">Sort</span>
                            <div class="segmented small" aria-label="Sort By">
                                <button class="seg-btn" data-sort="views" aria-selected="true">Views</button>
                                <button class="seg-btn" data-sort="likes">Likes</button>
                                <button class="seg-btn" data-sort="created_at">Date</button>
                                <button class="seg-btn" data-sort="current_version">Versions</button>
                                <button class="seg-btn" data-sort="qualityScore">Quality</button>
                            </div>
                            <button class="icon-btn" id="orderToggle" title="Toggle sort order" data-order="asc">↑</button>
                        </div>
                         <div class="stats-compact">
                            <span class="stat-chip"><span class="k">Analyzing</span><span id="analyzingCount">0</span></span>
                            <span class="stat-chip"><span class="k">Gems</span><span id="gemsFound">0</span></span>
                            <span class="stat-chip"><span class="k">Avg</span><span id="avgQuality">0.0</span></span>
                        </div>
                        <button id="filterToggle" class="filter-toggle-btn">⚙️ Filters</button>
                    </div>

                    <!-- Hidden form controls for app logic compatibility -->
                    <div class="visually-hidden">
                        <select id="discoveryMode">
                            <option value="gems" selected>Hidden Gems</option>
                            <option value="technical">Technical Marvels</option>
                            <option value="artistic">Artistic Spectacles</option>
                            <option value="underrated">Underrated All</option>
                            <option value="templates">Template Originals</option>
                        </select>
                        <select id="sortBy">
                            <option value="views" selected>Views</option>
                            <option value="likes">Likes</option>
                            <option value="created_at">Creation Date</option>
                            <option value="current_version">Versions</option>
                            <option value="qualityScore">Quality</option>
                        </select>
                        <select id="sortOrder">
                            <option value="asc" selected>Ascending</option>
                            <option value="desc">Descending</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div id="loading" class="loading hidden">
                <div class="loading-text">Analyzing projects</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <div id="results" class="results">
                <!-- Projects will be populated here -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Crafted for developers who appreciate technical excellence over viral trends</p>
        </div>
    </footer>

    <!-- Load scripts in correct order -->
    <script src="api.js"></script>
    <script src="filters.js"></script>
    <script src="ui-controls.js"></script>
    <script src="app.js"></script>
    
    <!-- Initialize after all scripts load -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ensure all global objects exist
            if (!window.websimAPI) {
                console.error('❌ websimAPI not initialized');
                return;
            }
            if (!window.gemFilter) {
                console.error('❌ gemFilter not initialized');
                return;
            }
            if (!window.uiManager) {
                console.error('❌ uiManager not initialized');
                return;
            }
            
            // Initialize the app
            window.app = new HiddenGemsApp();
            window.app.initialize();
        });
    </script>

</body>
</html>
