<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Gems - Websim Discovery Platform</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="matrix-bg"></div>
    
    <header class="header">
        <div class="container">
            <h1 class="title">
                Hidden Gems
                <span class="subtitle">Websim Discovery Platform</span>
            </h1>
            <p class="tagline">Discover technically sophisticated projects beyond the algorithmic noise</p>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="controls">
                <div class="filter-group">
                    <label class="filter-label">Minimum Revisions</label>
                    <input type="range" id="minVersions" min="10" max="200" value="50" class="slider">
                    <span id="minVersionsDisplay" class="value-display">50</span>
                </div>
                
                <div class="filter-group">
                    <label class="filter-label">Discovery Mode</label>
                    <select id="discoveryMode" class="select">
                        <option value="gems">Hidden Gems</option>
                        <option value="technical">Technical Marvels</option>
                        <option value="artistic">Artistic Spectacles</option>
                        <option value="underrated">Underrated All</option>
                        <option value="templates">Template Originals</option>
                    </select>
                </div>

                <button id="refreshBtn" class="btn-primary">
                    <span>Discover</span>
                    <svg class="btn-icon" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                        <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                    </svg>
                </button>
            </div>

            <div class="stats-bar">
                <div class="stat">
                    <span class="stat-label">Analyzing</span>
                    <span id="analyzingCount" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Gems Found</span>
                    <span id="gemsFound" class="stat-value">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Quality Score</span>
                    <span id="avgQuality" class="stat-value">0.0</span>
                </div>
            </div>

            <div id="loading" class="loading hidden">
                <div class="loading-content">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Analyzing projects</div>
                </div>
            </div>

            <div id="results" class="results">
                <!-- Projects will be populated here -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Crafted for the discerning developer • Built with precision</p>
        </div>
    </footer>

    <script src="api.js"></script>
    <script src="filters.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
