<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGem - Prestige Project Discovery</title>
    
    <!-- Refactored CSS modules -->
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="responsive.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="matrix-bg"></div>
    
    <header class="header">
        <div class="header-content">
            <div class="title-section">
                <h1 class="title">
                    <span class="rainbow-text">WebGem</span>
                    <span class="subtitle">Prestige Project Discovery</span>
                </h1>
                <p class="tagline">Discover technically sophisticated projects beyond the trending noise</p>
            </div>
            
            <div class="controls-section">
                <div class="controls">
                    <div class="controls-grid">
                        <div class="filter-group">
                            <label class="filter-label">Minimum Versions</label>
                            <input type="range" id="minVersions" min="10" max="200" value="50" class="slider">
                            <span id="minVersionsDisplay" class="value-display">50</span>
                        </div>
                        
                        <div class="filter-group">
                            <label class="filter-label">Discovery Mode</label>
                            <select id="discoveryMode" class="select">
                                <option value="gems">Hidden Gems</option>
                                <option value="technical">Technical Marvels</option>
                                <option value="artistic">Artistic Spectacles</option>
                                <option value="underrated">Underrated All</option>
                                <option value="templates">Template Originals</option>
                            </select>
                        </div>
                        
                        <div class="filter-group">
                            <label class="filter-label">Sort By</label>
                            <select id="sortBy" class="select">
                                <option value="views">Views</option>
                                <option value="likes">Likes</option>
                                <option value="created_at">Creation Date</option>
                                <option value="current_version">Versions</option>
                                <option value="qualityScore">Quality</option>
                            </select>
                        </div>
                        
                        <div class="filter-group">
                            <label class="filter-label">Sort Order</label>
                            <select id="sortOrder" class="select">
                                <option value="asc">Ascending</option>
                                <option value="desc">Descending</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="stats-controls">
                        <div class="stat-item">
                            <span class="stat-label">Analyzing</span>
                            <span id="analyzingCount" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Gems Found</span>
                            <span id="gemsFound" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Avg Quality</span>
                            <span id="avgQuality" class="stat-value">0.0</span>
                        </div>
                        
                        <button id="refreshBtn" class="btn-primary">
                            <span class="btn-text">Discover</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div id="loading" class="loading hidden">
                <div class="loading-text">Analyzing projects</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <div id="results" class="results">
                <!-- Projects will be populated here -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Crafted for developers who appreciate technical excellence over viral trends</p>
        </div>
    </footer>

    <script src="api.js"></script>
    <script src="filters.js"></script>
    <script src="ui.js"></script>
    <script src="app.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
