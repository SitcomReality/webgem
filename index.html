<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGem | Prestige Project Discovery</title>
    
    <!-- Refactored CSS modules -->
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="components/buttons.css">
    <link rel="stylesheet" href="components/forms.css">
    <link rel="stylesheet" href="components/cards.css">
    <link rel="stylesheet" href="components/controls.css">
    <link rel="stylesheet" href="components/filters.css">
    <link rel="stylesheet" href="components/loading.css">
    <link rel="stylesheet" href="components/tags.css">
    <link rel="stylesheet" href="components/stats.css">
    <link rel="stylesheet" href="components/curation.css">
    <link rel="stylesheet" href="components/toolbar.css">
    <link rel="stylesheet" href="responsive.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="matrix-bg"></div>
    
    <header class="header">
        <div class="header-content">
            <div class="title-section">
                <h1 class="title">
                    <span class="rainbow-text">WebGem</span>
                    <span class="subtitle">Prestige Project Discovery</span>
                </h1>
                <p class="tagline">Discover technically sophisticated projects beyond the trending noise</p>
            </div>
            
            <div class="controls-section">
                <div class="controls toolbar">
                    <div class="main-controls">
                        <div class="control-group versions-group">
                             <label for="minVersions" class="control-label">Min Versions</label>
                            <div class="range-inline">
                                <input type="range" id="minVersions" min="10" max="200" value="50" class="slider">
                                <span id="minVersionsDisplay" class="value-pill">50</span>
                            </div>
                        </div>
                        <div class="control-group versions-group">
                            <label for="maxViews" class="control-label">Max Views</label>
                            <div class="range-inline">
                                <input type="range" id="maxViews" min="100" max="10000" value="1000" class="slider">
                                <span id="maxViewsDisplay" class="value-pill">1K</span>
                            </div>
                        </div>
                        <button id="refreshBtn" class="btn-primary"><span class="btn-text">Discover</span></button>
                    </div>

                    <div class="secondary-controls">
                        <div class="inline-group sort-controls">
                            <span class="inline-label">Sort</span>
                            <div class="segmented small" aria-label="Sort By">
                                <button class="seg-btn" data-sort="prestige" aria-selected="true">Prestige</button>
                                <button class="seg-btn" data-sort="views">Views</button>
                                <button class="seg-btn" data-sort="likes">Likes</button>
                                <button class="seg-btn" data-sort="created_at">Date</button>
                                <button class="seg-btn" data-sort="current_version">Versions</button>
                                <button class="seg-btn" data-sort="qualityScore">Quality</button>
                            </div>
                            <button class="icon-btn" id="orderToggle" title="Toggle sort order" data-order="desc">↓</button>
                        </div>
                        <div class="inline-group view-controls">
                            <span class="inline-label">View</span>
                            <div class="segmented small" id="viewToggle">
                                <button class="seg-btn view-btn" data-view="grid" title="Grid View" aria-selected="true">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"></path></svg>
                                </button>
                                <button class="seg-btn view-btn" data-view="list" title="List View">
                                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 4h18v2H3zM3 11h18v2H3zM3 18h18v2H3z"></path></svg>
                                </button>
                            </div>
                        </div>
                         <div class="stats-compact">
                            <span class="stat-chip"><span class="k">Analyzing</span><span id="analyzingCount">0</span></span>
                            <span class="stat-chip"><span class="k">Gems</span><span id="gemsFound">0</span></span>
                            <span class="stat-chip"><span class="k">Avg</span><span id="avgQuality">0.0</span></span>
                        </div>
                        <button id="filterToggle" class="filter-toggle-btn">⚙️ Filters</button>
                    </div>

                    <!-- Hidden form controls -->
                    <div class="visually-hidden">
                        <select id="timeRange">
                            <option value="day" selected>Day</option>
                            <option value="week">Week</option>
                            <option value="month">Month</option>
                        </select>
                        <select id="sortBy">
                            <option value="prestige" selected>Prestige</option>
                            <option value="views">Views</option>
                            <option value="likes">Likes</option>
                            <option value="created_at">Creation Date</option>
                            <option value="current_version">Versions</option>
                            <option value="qualityScore">Quality</option>
                        </select>
                        <select id="sortOrder">
                            <option value="asc">Ascending</option>
                            <option value="desc" selected>Descending</option>
                        </select>
                        <select id="feedSource" class="visually-hidden">
                            <option value="search" selected>Search</option>
                            <option value="trending">Trending</option>
                            <option value="posts">Posts</option>
                        </select>
                        <select id="maxViews" class="visually-hidden">
                            <option value="1000" selected>1000</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div id="loading" class="loading hidden">
                <div class="loading-text">Analyzing projects</div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <div id="results" class="results">
                <!-- Projects will be populated here -->
            </div>
            <div id="loadMoreContainer" class="load-more-container hidden">
                <button id="loadMoreBtn" class="btn-primary">Load More Gems</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Crafted for developers who appreciate technical excellence over viral trends</p>
        </div>
    </footer>

    <!-- Load scripts in correct order -->
    <script src="api.js"></script>
    <script src="filters.js"></script>
    <script src="ui-controls/filter-panel.js"></script>
    <script src="ui-controls/grid-renderer.js"></script>
    <script src="ui-controls/curation-ui.js"></script>
    <script src="ui-controls.js"></script>
    <script src="curations.js"></script>
    <script src="app.js"></script>
    
    <!-- Initialize after all scripts load -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ensure all global objects exist before initializing
            const initInterval = setInterval(() => {
                if (window.websimAPI && window.gemFilter && window.uiManager && window.curationsDB) {
                    clearInterval(initInterval);
                    window.app = new HiddenGemsApp();
                    window.app.initialize();
                    
                    // Re-initialize curation UI now that DB is available
                    if (window.curationUI) {
                        window.curationUI.setup();
                    }
                }
            }, 100);
        });
    </script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
